# crates/config/default.toml; lower layers first:
# default < $XDG_CONFIG_HOME/spec-viewer/config.toml (else ~/.config/…) < <ROOT worktree>/.spec-viewer.toml < --config PATH
[web]                          # user config only
bind = "127.0.0.1"             # an IP, or a hostname to bind all interfaces; unauthenticated off loopback
# cert = "cert.pem"            # with key: serve HTTPS; PEM paths, relative to the config file
# key = "key.pem"

[tui]
diff = false                   # start with Diff on: tabs list only changed documents

# Keybindings, shared by the terminal and the web app (which uses search, the tree's up, down, left,
# right, and open, and search_dialog). A value is one key or an array of keys; [] unbinds the action.
# A key is a character or a name (enter, tab, esc, backspace, delete, insert, up, down, left, right,
# home, end, pageup, pagedown, space, plus, minus, comma, period, slash, backslash, backtick,
# semicolon, f1 … f24) after optional ctrl+, alt+, shift+, and cmd+ modifiers: "ctrl+u", "shift+tab".
# Shift+letter is the upper-case letter: "shift+y" and "Y" are the same key.
# A key may be bound once per table; force_quit also applies in every other table.
[keys]
force_quit = "ctrl+c"
quit = "q"
switch_tab = "1..9"            # tabs 1 to 9 in [[tab]] order; every key must end in 1..9
worktrees = "w"
search = ["/", "ctrl+k", "cmd+k"]
diff = "d"
open_web = "o"
toggle_files = "e"             # sidebar or rail, with a document open
toggle_panel = "b"             # hide or show the left pane, with a document open
toggle_focus = ["tab", "shift+tab"]
copy_path = "y"
copy_name = "Y"
hints = "f"                    # hint mode: type a label to open a link or copy an xref
dismiss = "esc"                # clear the footer message
page_up = "pageup"
page_down = "pagedown"
top = "g"
bottom = "G"
up = ["up", "k"]
down = ["down", "j"]
left = ["left", "h"]           # collapse; in the document, pan wide blocks
right = ["right", "l"]         # expand; in the document, pan wide blocks
open = "enter"

[keys.search_dialog]           # other printable characters type into the query
up = ["up", "ctrl+p", "ctrl+k"]
down = ["down", "ctrl+n", "ctrl+j"]
open = "enter"
clear = "ctrl+u"
delete_word = "ctrl+w"         # terminal only: browsers reserve ctrl+w
delete_char = "backspace"      # terminal only: the browser input edits itself
close = "esc"

[keys.worktree_picker]
up = ["up", "k"]
down = ["down", "j"]
open = "enter"
close = "esc"

[keys.hint_mode]               # other characters type hint labels
delete_char = "backspace"
close = "esc"

[theme]
mode = "auto"                  # auto | light | dark; auto = OSC 11 reply, else dark; --theme overrides
name = "terminal"              # built-ins: terminal
# light_name = "terminal"      # optional; theme used when mode resolves to light (default: name)
# dark_name = "terminal"       # optional; theme used when mode resolves to dark (default: name)

# Palette: name -> colour. A colour is "#rrggbb", "rgb(r,g,b)", an ANSI slot name, or "reset".
# Layering: active built-in < [theme.palette] < [theme.palette.<mode>]. New names are allowed.
[theme.palette]
# brand = "#ff79c6"
[theme.palette.light]
surface = "#eaeaee"            # hex: no ANSI slot is reliably one step off the terminal background
[theme.palette.dark]
surface = "#1f1f22"

[theme.roles]                  # every value names a palette colour
accent = "blue"                # focused border, current row and rail entry
muted = "bright_black"         # unfocused border, filter, paths, header details, footer, code label
inline_code = "yellow"
code_bg = "surface"            # code block and diagram background; code tokens use the ANSI slots
annotation = "yellow"          # margin-note line labels
warning = "yellow"             # degraded banner
headings = ["magenta", "blue", "cyan", "green", "yellow", "red"]
meter_progress = "cyan"
meter_complete = "green"
hint_fg = "black"
hint_bg = "yellow"
status_unknown = "bright_black" # also archived

[theme.roles.xref]
g = "cyan"
ng = "red"
pi = "magenta"
kd = "blue"
so = "yellow"
c = "yellow"
ct = "bright_blue"
vc = "green"
oq = "bright_magenta"
ex = "bright_cyan"
other = "bright_black"

# Tabs, in order (1 to 9); a later layer's `[[tab]]` list replaces this one. Each tab shows a path tree of the
# .md and .mdx files below its folder, minus those under another tab's deeper folder.
#   folder      worktree-relative; omitted = the whole worktree, listed through Git (ignored files excluded)
#   kinds       list only <name>.<kind>.md[x] files of these kinds; omitted = every file
#   companions  kinds nested under the document with the same <name>; unmatched ones stay listed
# A subfolder's index.md owns the other files there.
[[tab]]
name = "plans"
folder = ".plan"
companions = ["examples"]

[[tab]]
name = "specs"
kinds = ["spec"]
companions = ["examples", "discovery"]

[[status]]
name = "draft"
aliases = ["planned", "todo"]
color = "yellow"
[[status]]
name = "amended"
color = "yellow"
[[status]]
name = "ready"
aliases = ["review"]
color = "blue"
[[status]]
name = "accepted"
color = "blue"
[[status]]
name = "converging"
color = "blue"
[[status]]
name = "in-progress"
aliases = ["in progress", "wip"]
color = "cyan"
[[status]]
name = "implementing"
color = "cyan"
[[status]]
name = "blocked"
color = "red"
[[status]]
name = "done"
aliases = ["complete", "completed", "finished", "implemented"]
color = "green"

[[chip]]
label = "AC"
kind = "checklist"
sections = ["acceptance criteria"]
[[chip]]
label = "T"
kind = "checklist"
sections = ["implementation", "steps"]
[[chip]]
label = "phases"
kind = "headings"
sections = ["implementation", "steps"]
