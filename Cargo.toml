[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
crossterm = "0.29.0"
icu_collator = "2.3.1"
libc = "0.2.190"
markdown = "1.0.0"
notify = "8.2.0"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes", "default-themes"] }
textwrap = "0.16.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2.2"
insta = "1.49.0"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
