[package]
name = "plan-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "plan-viewer"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
crossterm = "0.29.0"
icu_collator = "2.3.1"
libc = "0.2.190"
markdown = "1.0.0"
notify = "8.2.0"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes", "default-themes"] }
textwrap = "0.16.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
