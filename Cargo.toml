[package]
name = "plan-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "plan-viewer"
path = "src/main.rs"

[dependencies]
icu_collator = "2.3.1"
markdown = "1.0.0"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy", "default-syntaxes", "default-themes"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
