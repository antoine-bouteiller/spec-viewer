[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
crossterm = "0.29.0"
libc = "0.2.191"
mermaid-text = "0.57.0"
markdown = "1.0.0"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "1"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["html", "parsing", "plist-load", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
base64 = "0.23.1"
insta = "1.49.0"
tempfile = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
